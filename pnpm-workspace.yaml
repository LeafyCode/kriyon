allowBuilds:
  esbuild: true
  lefthook: true
onlyBuiltDependencies:
  - esbuild
  - lefthook
# Force the transitive dev-only undici (pulled by jsdom for the test DOM env)
# to the patched line — clears GHSA-vxpw-j846-p89q / -hm92-r4w5-c3mj /
# -vmh5-mc38-953g and friends. jsdom declares undici ^7.25.0, so 7.28.x is
# in-range and safe.
overrides:
  undici: '^7.28.0'
verifyDepsBeforeRun: false
