# cargo-deny: checks Rust dependencies for known security holes, licences we
# can't ship, and crates from unknown sources. Run with `cargo deny check`.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Kriyon ships for macOS only. Linux builds in CI just to run the tests, and
# Windows is never built, so their platform-only crates are out of scope.
# The phone library (crates/kriyon-mobile) builds for iOS from nearly the
# same crates as macOS; listing iOS here would check the desktop app as if it
# ran on iOS too (its non-macOS Unix crates), which it never does.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
all-features = true

[advisories]
# Every vulnerability and unmaintained-crate advisory fails the check. To
# accept one, add it here with the reason and a date to look again.
ignore = [
  # basic-toml is unmaintained. It comes only through uniffi_bindgen, behind
  # kriyon-mobile's `bindgen` feature: the tool that writes the Swift
  # bindings at build time (scripts/mobile/build-ios.sh). It never ships in
  # the app or the phone library. Look again with the next uniffi release,
  # or by 2027-03-01.
  { id = "RUSTSEC-2026-0374", reason = "build-time binding generator only (uniffi_bindgen); never shipped" },
]

[licenses]
# Permissive licences, plus MPL-2.0 (file-level copyleft; we don't modify
# those files). Anything else fails until someone decides.
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

# Mozilla's CA root list, shipped as data under CDLA-Permissive-2.0; required by
# iroh-relay (kriyon-remote-link). Allowed for this crate only.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[licenses.private]
# Kriyon's own crates are not published to crates.io.
ignore = true

[bans]
# Duplicate versions are common in the Tauri tree and not a risk on their own.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
