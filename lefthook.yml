pre-commit:
  parallel: true
  jobs:
    - name: protect-base-branches
      run: |
        branch="$(git rev-parse --abbrev-ref HEAD)"
        case "$branch" in dev|main|master) echo "Direct commits to $branch are blocked"; exit 1;; esac
    - name: frontend-format-lint
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"
      run: pnpm dlx ultracite fix {staged_files}
      stage_fixed: true
    - name: typecheck
      glob: "*.{ts,tsx}"
      run: pnpm exec tsc --noEmit
    - name: rust-fmt
      glob: "*.rs"
      run: cargo fmt --check
    - name: rust-clippy
      glob: "*.rs"
      run: cargo clippy --all-targets -- -D warnings
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
pre-push:
  jobs:
    - name: tests
      run: pnpm test && cargo test
    - name: hook-tests
      run: pnpm test:node
