[package]
name = "kriyon-remote-link"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false
description = "The network link of Kriyon's remote access, over iroh: endpoints, accepting by paired id, pairing, streams and reconnects."

[dependencies]
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
kriyon-core = { path = "../kriyon-core", optional = true }
kriyon-remote = { path = "../kriyon-remote" }
parking_lot = { version = "0.12", optional = true }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time"] }

[features]
# The host side (`host_runtime`): serving paired devices. The desktop's;
# the phone's library leaves it out.
host-runtime = ["dep:kriyon-core", "dep:parking_lot"]
# Shared fakes for tests over loopback (`test_support`); never in a release.
test-support = ["tokio/rt-multi-thread"]

[dev-dependencies]
kriyon-remote-link = { path = ".", features = ["host-runtime", "test-support"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints.clippy]
all = "warn"
pedantic = "warn"
correctness = "deny"
