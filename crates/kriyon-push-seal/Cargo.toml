[package]
name = "kriyon-push-seal"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false
description = "The crypto of Kriyon's push without stored tokens: sealing a push token to the push sender's key, and signing and checking a host's wake-up. Shared by the phone, the host and the push sender."

[dependencies]
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
hpke = { version = "0.15", default-features = false, features = ["alloc", "chacha", "getrandom", "x25519"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"

[lints.clippy]
all = "warn"
pedantic = "warn"
correctness = "deny"
