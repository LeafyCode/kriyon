[package]
name = "kriyon-ptyd"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false

[[bin]]
name = "kriyon-ptyd"
path = "src/main.rs"

[dependencies]
kriyon-core = { path = "../kriyon-core" }
portable-pty = "0.9"
parking_lot = "0.13"
libc = "0.2"
vt100 = "0.18.1"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
all = "warn"
pedantic = "warn"
correctness = "deny"
