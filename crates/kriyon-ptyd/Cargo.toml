[package]
name = "kriyon-ptyd"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false

[[bin]]
name = "kriyon-ptyd"
path = "src/main.rs"

[dependencies]
kriyon-core = { path = "../kriyon-core" }
portable-pty = "0.9"
parking_lot = "0.13"
vt100 = "0.18.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
all = "warn"
pedantic = "warn"
correctness = "deny"
