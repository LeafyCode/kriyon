[package]
name = "kriyon-mobile"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Kriyon's phone library: the device side of remote access, for the phone app through UniFFI."

[lib]
# A plain library here. scripts/mobile/build-ios.sh builds the static
# library for iOS and the dynamic one the Swift bindings are read from, so
# desktop checks never link either.
name = "kriyon_mobile"

[[bin]]
# Generates the Swift bindings (scripts/mobile/build-ios.sh). Only built with
# the `bindgen` feature, so the desktop's checks never build its CLI.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
kriyon-remote = { path = "../kriyon-remote" }
kriyon-remote-link = { path = "../kriyon-remote-link" }
kriyon-relay-client = { path = "../kriyon-relay-client" }
# Held at 0.2.189: from 0.2.190 libc keeps the routing constants iroh's
# netwatch uses (and netdev's in6_ifreq) to macOS, so iroh no longer builds
# for iOS. One libc for the workspace, so the desktop uses it too. Lift once
# upstream ships the fix: issue n0-computer/net-tools#261, fix in PR #267
# (https://github.com/n0-computer/net-tools/pull/267), in a netwatch that
# iroh uses, with a netdev that builds for iOS (0.47 does).
libc = "=0.2.189"
# The push sender's key (GET /v1/key); both already in the tree via iroh.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }
uniffi = "0.32.2"

[dev-dependencies]
kriyon-relay-client = { path = "../kriyon-relay-client", features = ["test-support"] }
kriyon-core = { path = "../kriyon-core" }

[lints.clippy]
all = "warn"
pedantic = "warn"
correctness = "deny"
