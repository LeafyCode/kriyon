[package]
name = "kriyon-push"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Kriyon's push sender: opens a sealed push token in memory, sends one plain alert through APNs or FCM, and forgets it. Stores nothing."

[dependencies]
base64 = "0.22"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
kriyon-push-seal = { path = "../kriyon-push-seal" }
reqwest = { version = "0.13", default-features = false, features = ["form", "http2", "json", "rustls-no-provider"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }

[lints.clippy]
all = "warn"
pedantic = "warn"
correctness = "deny"
