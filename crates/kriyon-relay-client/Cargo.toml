[package]
name = "kriyon-relay-client"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Our relay as an app uses it: device sign-in, the BisBig API calls, the relay pass and its renewal. Shared by the desktop and the phone."

[dependencies]
kriyon-remote = { path = "../kriyon-remote" }
kriyon-remote-link = { path = "../kriyon-remote-link" }
# Both already in the tree through iroh.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["macros", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints.clippy]
all = "warn"
pedantic = "warn"
correctness = "deny"
