[package]
name = "kriyon-remote"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Remote access protocol for Kriyon: messages, codec, control, authorize. Pure: no network, no IO."

[dependencies]
kriyon-core = { path = "../kriyon-core" }
hmac = "0.12"
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
serde_json = "1"

[lints.clippy]
all = "warn"
pedantic = "warn"
correctness = "deny"
