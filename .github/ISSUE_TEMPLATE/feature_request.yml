name: Feature request
description: Suggest something Kriyon should do.
labels: [feature, needs triage]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas, start a thread in [Discussions](https://github.com/LeafyCode/kriyon/discussions) first. Use this form when you can describe a specific problem.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How you'd like Kriyon to handle it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other options you considered
      description: Workarounds you use now, or other ways to solve it.
  - type: checkboxes
    id: contribute
    attributes:
      label: Helping out
      options:
        - label: I'd like to build this myself, with guidance.
