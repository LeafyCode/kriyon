name: Mobile

# The phone app's lint, types and tests, and an Android build: the Rust library
# for Android, the Kotlin module's tests and the app's Gradle build, none of
# which needs a secret. The library's own tests run in CI's Rust job with the
# rest of the workspace; iPhone builds (Xcode, signing) are not part of CI yet.
on:
  push:
    branches: [dev, main]
    paths:
      - mobile/**
      - crates/kriyon-mobile/**
      - crates/kriyon-remote/**
      - crates/kriyon-remote-link/**
      - crates/kriyon-relay-client/**
      - crates/kriyon-push/**
      - crates/kriyon-push-seal/**
      - Cargo.toml
      - Cargo.lock
      # The desktop files the phone app reads: the screen stream and themes.
      - src/remote/remoteScreen.ts
      - src/remote/hostSummary.ts
      - scripts/mobile/build-android.sh
      - src/theme/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - biome.jsonc
      - .github/workflows/mobile.yml
  pull_request:
    branches: [dev, main]
    paths:
      - mobile/**
      - crates/kriyon-mobile/**
      - crates/kriyon-remote/**
      - crates/kriyon-remote-link/**
      - crates/kriyon-relay-client/**
      - crates/kriyon-push/**
      - crates/kriyon-push-seal/**
      - Cargo.toml
      - Cargo.lock
      # The desktop files the phone app reads: the screen stream and themes.
      - src/remote/remoteScreen.ts
      - src/remote/hostSummary.ts
      - scripts/mobile/build-android.sh
      - src/theme/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - biome.jsonc
      - .github/workflows/mobile.yml
  workflow_dispatch:

# Nothing by default; each job asks for what it needs.
permissions: {}

# A new push to the same branch or pull request cancels the run it replaces.
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Phone app (lint, types, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 24: the terminal page's build script imports the desktop's theme
          # files (TypeScript) directly.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check mobile
      - run: pnpm --filter @kriyon/mobile typecheck
      - run: pnpm --filter @kriyon/mobile test

  android:
    name: Phone app (Android build)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      # React Native 0.88's NDK, which scripts/mobile/build-android.sh uses.
      NDK_VERSION: 27.1.12297006
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The runner's own rustup, as CI's Rust job.
      - run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The runner has the Android SDK and Java 17; the NDK version may differ.
      - run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - run: scripts/mobile/build-android.sh
      - run: npx expo prebuild --platform android --no-install
        working-directory: mobile/app
        env:
          CI: "1"
      # The Kotlin module's tests, then the app as a phone would install it
      # (debug: no signing). 64-bit Arm only, as the library.
      - run: ./gradlew --no-daemon :kriyon-native:testDebugUnitTest :app:assembleDebug -PreactNativeArchitectures=arm64-v8a
        working-directory: mobile/app/android
