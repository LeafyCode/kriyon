name: Claude

# A maintainer types @claude in an issue, a pull request comment or a review to
# get help. claude-code-action itself refuses anyone without write access to the
# repo; never widen that with allowed_non_write_users.
#
# Never on a fork's pull request. The action checks out the pull request's code
# and restores only `.claude/`, `.mcp.json` and the root `CLAUDE.md` from the base
# branch. The fork's `AGENTS.md` and folder rule files would still reach Claude as
# instructions, in a job holding the API key and a write token. The first step
# stops the job for a fork; review those with /pr-review from a clean checkout
# (docs/AI.md). And never `pull_request_target`.
#
# Off while the repo is private. The ANTHROPIC_API_KEY secret is set on the
# public repo when it launches.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

permissions: {}

jobs:
  claude:
    name: Claude
    if: >-
      !github.event.repository.private && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # push commits to a branch when asked
      pull-requests: write # comment on and update pull requests
      issues: write # comment on issues
      id-token: write # sign in to the Claude GitHub App
      actions: read # read CI results on pull requests
    steps:
      - name: Stop on a fork's pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event.issue.pull_request != null || github.event.pull_request != null }}
        run: |
          if [ "$IS_PR" != "true" ]; then
            exit 0
          fi
          # A deleted fork reports no head repo, which also stops here.
          head=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.head.repo.full_name')
          if [ "$head" != "$REPO" ]; then
            echo "::error::Claude doesn't run on pull requests from forks. Review this one with /pr-review from a clean checkout."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1.0.247
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The team default from docs/AI.md: Opus at medium effort.
          claude_args: --model opus
          settings: '{"effortLevel": "medium"}'
