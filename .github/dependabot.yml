# Weekly dependency updates, grouped so each ecosystem is one pull request.
# Actions stay pinned to commit SHAs; Dependabot updates the SHA and the
# version comment together.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it, so a compromised or
    # broken version is usually caught and pulled first.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        patterns: ["*"]
    # `tauri build` refuses an npm Tauri package and its Rust crate on
    # different minor versions, and Dependabot can't bump npm and Cargo in one
    # pull request. So minor and major Tauri bumps are done by hand, both sides
    # together; patches and security updates still come. Keep in step with the
    # cargo entry below.
    ignore:
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: npm
    directory: /website
    target-branch: dev
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it, so a compromised or
    # broken version is usually caught and pulled first.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      website:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it, so a compromised or
    # broken version is usually caught and pulled first.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo:
        patterns: ["*"]
    # Minor and major Tauri bumps by hand, with their npm side (see the npm
    # entry above).
    ignore:
      - dependency-name: "tauri*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it, so a compromised or
    # broken version is usually caught and pulled first.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
